name: Daily BRIDGE feed pack

on:
  schedule:
    - cron: '10 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download and pack the 511 feed
        env:
          API_511_KEY: ${{ secrets.API_511_KEY }}
        run: python3 pack_feed.py out

      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/bridge-feed.zip out/feed-meta.json --title "Latest packed feed" --notes "Packed automatically once a day from 511's Regional GTFS feed."
