name: BRIDGE real-time delays

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rt
  cancel-in-progress: true

jobs:
  rt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GTFS-RT bindings
        run: pip install --quiet gtfs-realtime-bindings
      - name: Build delays.json
        env:
          API_511_KEY: ${{ secrets.API_511_KEY }}
        run: python3 rt_fetch.py out
      - name: Publish to rt branch
        run: |
          cd out
          git init -q
          git checkout -q --orphan rt
          git config user.name "bridge-rt"
          git config user.email "bridge-rt@users.noreply.github.com"
          git add delays.json
          git commit -qm "Real-time delays"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" rt
